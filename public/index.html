<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy or Invest?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 32px;
            color: #fff;
            letter-spacing: -0.5px;
        }
        
        .input-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 18px;
            color: #fff;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(120, 219, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(120, 219, 255, 0.1);
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .result {
            background: rgba(120, 219, 255, 0.05);
            border: 1px solid rgba(120, 219, 255, 0.2);
            padding: 28px;
            border-radius: 16px;
            margin-top: 32px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .result-value {
            font-size: 48px;
            font-weight: 700;
            color: #78dbff;
            margin-bottom: 16px;
            letter-spacing: -1px;
            line-height: 1;
        }
        
        .result-detail {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
        }
        
        .highlight {
            color: #78dbff;
            font-weight: 600;
        }
        
        .info {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.6;
        }
        
        .settings {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 32px;
            padding-top: 24px;
        }
        
        .settings-header {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            transition: color 0.2s;
        }
        
        .settings-header:hover {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .settings-header::after {
            content: '▼';
            font-size: 10px;
            transition: transform 0.2s;
        }
        
        .settings-header.collapsed::after {
            transform: rotate(-90deg);
        }
        
        .settings-content {
            max-height: 600px;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 1;
        }
        
        .settings-content.collapsed {
            max-height: 0;
            opacity: 0;
        }
        
        .settings .input-group:last-child {
            margin-bottom: 0;
        }
        
        .settings input {
            font-size: 16px;
            padding: 14px 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Buy or Invest?</h1>
        
        <div class="input-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="1000" value="1000" step="100" autofocus>
        </div>
        
        <div class="result" id="result" style="display: none;">
            <div class="result-label">If you invest instead of buying:</div>
            <div class="result-value" id="futureValue">0</div>
            <div class="result-detail" id="details"></div>
        </div>
        
        <div class="settings">
            <div class="settings-header" id="settingsToggle">Settings (saved automatically)</div>
            <div class="settings-content" id="settingsContent">
                <div class="input-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                </div>
                
                <div class="input-group">
                    <label for="retirement">Retirement Age</label>
                    <input type="number" id="retirement" placeholder="60" value="60" min="30" max="80">
                </div>
                
                <div class="input-group">
                    <label for="return">Expected Annual Return (%)</label>
                    <input type="number" id="return" placeholder="7" value="7" step="0.5" min="0" max="20">
                </div>
                
                <div class="input-group">
                    <label for="targetPortfolio">Target Retirement Portfolio</label>
                    <input type="number" id="targetPortfolio" placeholder="750000" value="750000" step="10000" min="0">
                </div>
                
                <div class="input-group">
                    <label for="withdrawalRate">Withdrawal Rate (%)</label>
                    <input type="number" id="withdrawalRate" placeholder="3.5" value="3.5" step="0.1" min="0" max="10">
                </div>
            </div>
        </div>
        
        <div class="info">
            Adjust the expected return in Settings to match your investment vehicle.
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'buy-or-invest';
        
        function loadSettings() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.dob) document.getElementById('dob').value = data.dob;
                    if (data.retirement) document.getElementById('retirement').value = data.retirement;
                    if (data.return) document.getElementById('return').value = data.return;
                    if (data.amount) document.getElementById('amount').value = data.amount;
                    if (data.targetPortfolio) document.getElementById('targetPortfolio').value = data.targetPortfolio;
                    if (data.withdrawalRate) document.getElementById('withdrawalRate').value = data.withdrawalRate;
                } catch (e) {}
            }
        }
        
        function saveSettings() {
            const data = {
                dob: document.getElementById('dob').value,
                retirement: document.getElementById('retirement').value,
                return: document.getElementById('return').value,
                amount: document.getElementById('amount').value,
                targetPortfolio: document.getElementById('targetPortfolio').value,
                withdrawalRate: document.getElementById('withdrawalRate').value
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        
        function getAge(dob) {
            const today = new Date();
            const birthDate = new Date(dob);
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }
        
        function calculate() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const dob = document.getElementById('dob').value;
            const retirementAge = parseInt(document.getElementById('retirement').value) || 60;
            const annualReturn = parseFloat(document.getElementById('return').value) || 7;
            const targetPortfolio = parseFloat(document.getElementById('targetPortfolio').value) || 0;
            const withdrawalRate = parseFloat(document.getElementById('withdrawalRate').value) || 3.5;
            
            if (!dob) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('futureValue').textContent = '—';
                document.getElementById('details').innerHTML = `
                    Set your <span class="highlight">Date of Birth</span> in Settings to see results
                `;
                return;
            }
            
            const currentAge = getAge(dob);
            const yearsToRetirement = Math.max(0, retirementAge - currentAge);
            
            if (amount <= 0 || yearsToRetirement <= 0) {
                document.getElementById('result').style.display = 'none';
                return;
            }
            
            const futureValue = amount * Math.pow(1 + annualReturn / 100, yearsToRetirement);
            const annualIncome = futureValue * (withdrawalRate / 100);
            const dailyIncome = annualIncome / 365;
            const targetDailyIncome = targetPortfolio > 0 ? (targetPortfolio * (withdrawalRate / 100)) / 365 : 0;
            const daysOfIncome = targetDailyIncome > 0 ? Math.round(futureValue / targetDailyIncome) : 0;
            const portfolioPercent = targetPortfolio > 0 ? (futureValue / targetPortfolio * 100) : 0;
            
            document.getElementById('futureValue').textContent = `${futureValue.toLocaleString('en-EU', {maximumFractionDigits: 0})}`;
            document.getElementById('details').innerHTML = `
                Age <span class="highlight">${currentAge}</span> → retirement in <span class="highlight">${yearsToRetirement} years</span><br>
                ${amount.toLocaleString('en-EU')} at ${annualReturn}% annual return<br>
                = <span class="highlight">${futureValue.toLocaleString('en-EU', {maximumFractionDigits: 0})}</span> at age ${retirementAge}<br>
                <br>
                That's <span class="highlight">${daysOfIncome} days</span> of your target retirement budget<br>
                You're spending <span class="highlight">${portfolioPercent.toFixed(2)}%</span> of your retirement portfolio
            `;
            
            document.getElementById('result').style.display = 'block';
        }
        
        // Load saved settings on init
        loadSettings();
        
        // Settings toggle
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsContent = document.getElementById('settingsContent');
        const settingsCollapsed = localStorage.getItem('buy-or-invest-collapsed') === 'true';
        if (settingsCollapsed) {
            settingsToggle.classList.add('collapsed');
            settingsContent.classList.add('collapsed');
        }
        settingsToggle.addEventListener('click', () => {
            const isCollapsed = settingsContent.classList.toggle('collapsed');
            settingsToggle.classList.toggle('collapsed', isCollapsed);
            localStorage.setItem('buy-or-invest-collapsed', isCollapsed);
        });
        
        // Save and recalculate on any input change
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                saveSettings();
                calculate();
            });
        });
        
        // Initial calculation
        calculate();
    </script>
</body>
</html>
